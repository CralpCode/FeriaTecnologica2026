[platformio]
src_dir = ../tools/spo2/module_firmware
build_dir = .pio/max30102-test
libdeps_dir = .pio/libdeps

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_src_filter =
    -<*>
    +<main.cpp>
    +<driver.cpp>
    +<reference.cpp>
    +<quality.cpp>
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
