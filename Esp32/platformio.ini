[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
