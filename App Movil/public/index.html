    <style id="spiroscan-splash-style">
      #spiroscan-splash {
        position: fixed; inset: 0; z-index: 9999; background: #FFFFFF;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        transition: opacity 0.35s ease;
      }
      #spiroscan-splash.ss-out { opacity: 0; pointer-events: none; }
      #spiroscan-splash .ss-logo { width: min(64vw, 300px); height: auto; animation: ss-in 0.6s ease-out both; }
      #spiroscan-splash .ss-bar {
        position: relative; width: min(40vw, 160px); height: 3px; border-radius: 3px; overflow: hidden;
        background: #E3E7EC; animation: ss-fade 0.6s 0.3s ease-out both;
      }
      #spiroscan-splash .ss-bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #0E385F, #1C7F8A, #20BE8C);
        animation: ss-run 1.1s ease-in-out infinite;
      }
      @keyframes ss-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes ss-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ss-run { from { left: -40%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #spiroscan-splash .ss-logo, #spiroscan-splash .ss-bar { animation: none; }
        #spiroscan-splash .ss-bar::after { animation: none; left: 30%; }
      }
    </style>
