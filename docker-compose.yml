# En la Mac se recomienda ./start_server.sh (backend nativo): Docker en macOS no tiene
# acceso a la GPU, así que el LLM debe correr en Ollama nativo, fuera de contenedores.
# Este compose queda como alternativa para correr SOLO el backend en un contenedor.
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: spiroscan-backend:latest
    container_name: spiroscan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/telemetry.db:/app/telemetry.db
      - ./Backend/recordings:/app/recordings
      - ./Backend/reports:/app/reports
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_MODEL=qwen3:32b
    extra_hosts:
      - "host.docker.internal:host-gateway"
