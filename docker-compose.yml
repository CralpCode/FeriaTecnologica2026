services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: spiroscan-backend:latest
    container_name: spiroscan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/telemetry.db:/app/telemetry.db
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
      - AI_PROVIDER=ollama
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama

volumes:
  ollama:
    external: true
